name: End-to-end

# The whole app driven on macOS, Windows and Linux, with screenshots of the UI on each.
on:
  workflow_dispatch:
  push:
    branches: ['review/**']

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux build and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libudev-dev xvfb lrzsz
      - name: lrzsz (macOS)
        if: runner.os == 'macOS'
        run: brew install lrzsz
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
        timeout-minutes: 10
      - name: End-to-end suites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e; else npm run test:e2e; fi
        timeout-minutes: 30
      - name: Screenshots
        if: always()
        shell: bash
        env:
          TERMCRAFT_SHOTS_OUT: ${{ runner.temp }}/shots
          TERMCRAFT_SHOTS: ${{ runner.temp }}/shots
          CI: 'true'
        run: |
          mkdir -p "$TERMCRAFT_SHOTS_OUT"
          shoot() { # shoot <script> <profile>
            if [ "$RUNNER_OS" = "Linux" ]; then
              TERMCRAFT_SMOKE="$1" xvfb-run -a -s "-screen 0 1600x1000x24" npx electron . --user-data-dir="$2" --no-sandbox || true
            else
              TERMCRAFT_SMOKE="$1" npx electron . --user-data-dir="$2" || true
            fi
          }
          shoot scripts/screenshots.js "$RUNNER_TEMP/ud1"
          shoot test/smoke/themes-smoke.js "$RUNNER_TEMP/ud2"
          ls -la "$TERMCRAFT_SHOTS_OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          retention-days: 7
