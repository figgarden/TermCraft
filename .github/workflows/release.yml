name: Release

# Push a tag like v0.1.0 to build installers on macOS, Windows and Linux and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip --arm64 --x64
          - os: windows-latest
            args: --win nsis portable --x64
          - os: ubuntu-latest
            args: --linux AppImage deb rpm --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libudev-dev rpm
      - run: npm ci
      - run: npm test
        timeout-minutes: 10
      # Electron fetches its runtime lazily; the build bundles its LICENSE and Chromium notices
      # from there, so make sure they exist (and fail rather than ship without them).
      - name: Fetch Electron runtime and check license notices
        shell: bash
        run: |
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/LICENSE
          test -f node_modules/electron/dist/LICENSES.chromium.html
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check bundled license notices
        shell: bash
        run: |
          missing=0
          for f in LICENSE.electron.txt LICENSES.chromium.html LICENSE.TermCraft.txt THIRD-PARTY-NOTICES.md; do
            if ! find dist -path "*licenses/$f" -print -quit | grep -q .; then echo "missing $f"; missing=1; fi
          done
          exit $missing
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat docs/release-footer.md >> notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "TermCraft $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
