name: Release

# Push a tag like v0.1.0 to build installers on macOS, Windows and Linux and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: mac-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev rpm lrzsz
      - run: npm ci
      # Tests run on the native build only (the Intel Mac build is cross-compiled).
      - run: npm test
        if: matrix.name != 'mac-x64'
        timeout-minutes: 20
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build installers
        shell: bash
        run: |
          # The Tauri CLI wants frontendDist to exist up front; build.rs fills it while compiling.
          # (Elsewhere `npm test` already made it; mac-x64 skips the tests.)
          mkdir -p src-tauri/web
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The .dmg step scripts Finder, which hosted runners allow.
            cargo tauri build --target ${{ matrix.target }} --bundles app,dmg
          else
            cargo tauri build --target ${{ matrix.target }}
          fi
      # Same file names as earlier releases: TermCraft-<version>-<platform>.<ext>
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          B=src-tauri/target/${{ matrix.target }}/release
          mkdir -p out
          one() { local f; f=$(ls $1 2>/dev/null | head -1); [ -n "$f" ] || { echo "missing $1"; exit 1; }; cp "$f" "out/$2"; echo "$2 <- $f"; }
          case "${{ matrix.name }}" in
            mac-*)
              one "$B/bundle/dmg/*.dmg" "TermCraft-$V-${{ matrix.name }}.dmg"
              ditto -c -k --sequesterRsrc --keepParent "$B/bundle/macos/TermCraft.app" "out/TermCraft-$V-${{ matrix.name }}.zip" ;;
            win-x64)
              one "$B/bundle/nsis/*-setup.exe" "TermCraft-$V-win-x64-setup.exe"
              one "$B/bundle/msi/*.msi" "TermCraft-$V-win-x64.msi"
              one "$B/termcraft.exe" "TermCraft-$V-win-x64-portable.exe" ;;
            linux-x86_64)
              one "$B/bundle/appimage/*.AppImage" "TermCraft-$V-linux-x86_64.AppImage"
              one "$B/bundle/deb/*.deb" "TermCraft-$V-linux-amd64.deb"
              one "$B/bundle/rpm/*.rpm" "TermCraft-$V-linux-x86_64.rpm" ;;
          esac
          ls -la out
      - name: Check bundled license notices
        shell: bash
        run: |
          B=src-tauri/target/${{ matrix.target }}/release
          for f in LICENSE THIRD-PARTY-NOTICES.md; do
            find "$B" -name "$f" -print -quit | grep -q . || { echo "missing $f in the build"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: out/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat docs/release-footer.md >> notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "TermCraft $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
